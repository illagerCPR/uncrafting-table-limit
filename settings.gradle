pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = uri('https://plugins.gradle.org/m2') }
        maven { url = uri('https://maven.neoforged.net/releases') }
        maven { url = uri('https://mirrors4.qlu.edu.cn/bmclapi') }
        maven { url = uri('https://maven.parchmentmc.org') }
    }
}

rootProject.name = 'uncrafting-table-limit'

// Central repository declaration for the project *and* for ModDevGradle's internal
// toolchain configurations (NeoForm runtime, external tools, Minecraft artifacts).
//
// PREFER_SETTINGS is used because ModDevGradle pins part of its toolchain to
// maven.neoforged.net, which is unreachable from some networks. All repositories the
// toolchain needs are declared here instead.
//
// The qlu mirror is a general Maven Central proxy (it also carries the NeoForge tree), so
// it is listed first. The `NeoForged` entry below can optionally be pointed at
// tools/neoforge_mirror_proxy.py with -PneoforgeProxy=... ; that proxy serves the NeoForge
// layout from the mirror and falls back to the local Gradle cache for artifacts the mirror
// does not carry.
dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.PREFER_SETTINGS
    repositories {
        def neoforgeUrl = providers.gradleProperty('neoforgeProxy')
                .getOrElse('https://maven.neoforged.net/releases')

        // `net.neoforged:minecraft-dependencies` is published as Gradle Module Metadata
        // ONLY - there is no POM on maven.neoforged.net. ModDevGradle resolves it through
        // a module-metadata-only repository (RepositoriesPlugin does exactly this with
        // `metadataSources { gradleMetadata() }` + `includeModule(...)`). PREFER_SETTINGS
        // replaces that repository, so it is re-created here with the same shape; otherwise
        // resolution can fall back to the nonexistent POM and fail with
        // "Could not find net.neoforged:minecraft-dependencies".
        maven {
            name = 'NeoForge (minecraft-dependencies module metadata)'
            url = uri(neoforgeUrl)
            content { includeModule('net.neoforged', 'minecraft-dependencies') }
            metadataSources { gradleMetadata() }
        }

        if (providers.gradleProperty('neoforgeProxy').isPresent()) {
            // Local proxy REPLACES the official NeoForge repository entirely when given:
            // it serves the same layout from a mirror, the local Gradle cache and a seed
            // directory, and logs every request so missing artifacts are easy to spot.
            maven {
                name = 'NeoForge (local proxy)'
                url = uri(neoforgeUrl)
            }
        } else {
            maven {
                name = 'NeoForged'
                url = uri(neoforgeUrl)
            }
        }
        maven {
            name = 'Mojang libraries'
            url = uri('https://libraries.minecraft.net')
        }
        mavenCentral()
        maven {
            name = 'CurseMaven'
            url = uri('https://www.cursemaven.com')
        }
    }
}
